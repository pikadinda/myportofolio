{% extends "base.html" %}

{% block title %}
Add Experience - Pika
{% endblock title %}

{% block content %}
<main>
    <section class="experience-section">
        <div class="container">
            <div class="section-header">
                <p class="section-kicker">Add Experience</p>
                <h1>Add a new experience</h1>
                <p>
                    Fill in the details below to add a new experience
                    to the portfolio.
                </p>
            </div>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">Add Experience</button>
            </form>
        </div>
    </section>
</main>
{% endblock content %}
